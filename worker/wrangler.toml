# Cloudflare Worker that holds the Airtable token for the label page.
# Deploy from this folder:  npx wrangler deploy
# Secrets (never put them in this file):
#   npx wrangler secret put AIRTABLE_TOKEN
#   npx wrangler secret put TEAM_CODE        (optional team passcode)
name = "ssco-label-proxy"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the Worker: origin only, no path, comma-separated.
ALLOWED_ORIGINS = "https://southernshirt.github.io"
